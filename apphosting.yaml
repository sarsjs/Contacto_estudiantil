runConfig:
  runtime: nodejs20
  env:
    # Variables públicas necesarias para la inicialización de Firebase en el cliente.
    # Cárgalas como variables o secretos administrados en App Hosting según el entorno.
    - variable: NEXT_PUBLIC_FIREBASE_API_KEY
      value: ""
    - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
      value: ""
    - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
      value: ""
    - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
      value: ""
    - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
      value: ""
    - variable: NEXT_PUBLIC_FIREBASE_APP_ID
      value: ""
    - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
      value: ""
    # Clave pública de reCAPTCHA v3 para App Check (opcional pero recomendada)
    - variable: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
      value: ""
